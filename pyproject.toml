[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kobo-md"
version = "0.1.0"
description = "Read Kobo Notebooks and Parse to Markdown"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Luke" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer[all]",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "browser-cookie3",
    "beautifulsoup4",
    "lxml",
    "rich",
    "python-dateutil",
    "toml",
]

[project.optional-dependencies]
ai = [
    "anthropic",
    "openai",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
kobo-md = "kobo_md.cli:app"

[project.urls]
Homepage = "https://github.com/lukepatrick/kobo-notebooks-markdown"
Repository = "https://github.com/lukepatrick/kobo-notebooks-markdown"

[tool.hatch.build.targets.wheel]
packages = ["src/kobo_md"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["kobo_md"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "browser_cookie3.*",
    "toml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
